name: Update QuickTickets Afisha

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and Merge QuickTickets Events
        env:
          QT_TOKEN: ${{ secrets.QT_API_TOKEN }}
        run: |
          # 1. Запрос собственных мероприятий «Нефтяника» (ID 3495)
          curl -s -H "Authorization: Bearer $QT_TOKEN" \
               -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
               "https://api2.quicktickets.ru/afisha/v2/event/list?organisationId=3495" \
               -o neftyanik.json

          # 2. Запрос мероприятий ДК «Русь» (организатор 3351: «Старший сын»)
          curl -s -H "Authorization: Bearer $QT_TOKEN" \
               -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
               "https://api2.quicktickets.ru/afisha/v2/event/list?organisationId=3351" \
               -o rus.json

          # 3. Объединяем события обоих учреждений в общий events.json
          jq -s '
            {
              status: "success",
              data: {
                events: (
                  ((.[0].data.events // .[0].events // {}) ) * 
                  ((.[1].data.events // .[1].events // {}) )
                )
              }
            }
          ' neftyanik.json rus.json > events.json

          echo "Проверка events.json (первые 300 символов):"
          head -c 300 events.json
          echo ""

          # Проверяем, попал ли спектакль в файл
          if grep -q "221" events.json || grep -q "Старший" events.json; then
            echo "Успех: Спектакль Старший сын найден в итоговом файле!"
          else
            echo "Внимание: Событие e221 пока не найдено во втором запросе."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Update QuickTickets Afisha

on:
  schedule:
    # Запуск каждый час
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch QuickTickets Events API
        env:
          QT_TOKEN: ${{ secrets.QT_API_TOKEN }}
        run: |
          curl -s -H "Authorization: Bearer $QT_TOKEN" \
               -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
               "https://api2.quicktickets.ru/afisha/v2/event/list?organisationAlias=noyabrsk-ckii-neftyanik" \
               -o events.json
          
          # Выводим в лог первые 300 символов ответа для отладки
          head -c 300 events.json
          echo ""

          # Проверка на ошибку авторизации
          if grep -q "authorization-header-not-found" events.json || grep -q '"status":"error"' events.json; then
            echo "API вернул ошибку авторизации!"
            cat events.json
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
